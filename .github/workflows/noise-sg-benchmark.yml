name: Noise-only P2P SG four-session transport baseline
on:
  pull_request:
    branches: [feature/raw-cnet-sg-equal-load-23]
    paths:
      - 'mesh/bench/**'
      - 'tests/salts_foundation/CMakeLists.txt'
      - '.github/workflows/noise-sg-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  noise-sg:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-salts-sdk
      - uses: ./.github/actions/setup-compiler-cache
        with:
          profile: linux-noise-only-sg-equal-load
      - name: Build genuine Noise-only P2P NativeIO SG profiles
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/salts_foundation -B build/noise-sg-bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DP2P_NOISE_SG_BUILD_BENCHMARKS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build build/noise-sg-bench --parallel 2 --target \
            bench_noise_sg_1 bench_noise_sg_2 bench_noise_sg_4
      - name: Verify four distinct Noise identities and exact SG echo work
        shell: bash
        env:
          P2P_MMP_BENCH_WARMUP: '8'
          P2P_MMP_BENCH_ROUNDS: '32'
        run: |
          set -euo pipefail
          echo 'protocol,driver,final_owners,total_shards,sessions,payload_bytes,rounds,warmup,wall_ms,process_cpu_ms,process_cpu_pct,app_msgs_per_s,payload_mib_per_s,rtt_p50_us,rtt_p95_us,rtt_p99_us' > noise-sg-aggregate.csv
          echo 'protocol,driver,final_owners,total_shards,session_id,payload_bytes,rounds,rtt_p50_us,rtt_p95_us,rtt_p99_us' > noise-sg-sessions.csv
          echo 'driver,final_owners,total_shards,session_id,payload_bytes,round,rtt_us' > noise-sg-rtt.csv
          {
            uname -a
            lscpu
            git rev-parse HEAD
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            echo "SALTS_ROOT=$SALTS_ROOT"
            echo "SALTS_UTILS_ROOT=$SALTS_UTILS_ROOT"
          } > noise-sg-machine.txt
          for bytes in 8 1024; do
            for finals in 1 2 4; do
              export P2P_MMP_BENCH_PAYLOAD="$bytes"
              log="noise-sg-$finals-final-$bytes-B.log"
              "./build/noise-sg-bench/bench_noise_sg_$finals" | tee "$log"
              grep '^NOISE_SG_BENCH,' "$log" |
                sed 's/^NOISE_SG_BENCH,//' >> noise-sg-aggregate.csv
              grep '^NOISE_SG_SESSION,' "$log" |
                sed 's/^NOISE_SG_SESSION,//' >> noise-sg-sessions.csv
              grep '^NOISE_SG_RTT,' "$log" |
                sed 's/^NOISE_SG_RTT,//' >> noise-sg-rtt.csv
            done
          done
          python3 - <<'PY'
          import csv,math
          def load(path):
              with open(path, newline="", encoding="utf8") as stream:
                  return list(csv.DictReader(stream))
          profiles=load("noise-sg-aggregate.csv")
          sessions=load("noise-sg-sessions.csv")
          rtts=load("noise-sg-rtt.csv")
          expected={(n,b) for n in (1,2,4) for b in (8,1024)}
          found=set()
          for row in profiles:
              n,b=int(row["final_owners"]),int(row["payload_bytes"])
              if ((n,b) not in expected or (n,b) in found
                  or row["protocol"]!="noise-only-p2p-echo"
                  or row["driver"]!="global-barrier"
                  or int(row["total_shards"])!=n+1
                  or int(row["sessions"])!=4
                  or int(row["warmup"])!=8 or int(row["rounds"])!=32
                  or any(not math.isfinite(float(row[k])) or float(row[k])<=0
                         for k in ("wall_ms","app_msgs_per_s","rtt_p95_us"))):
                  raise SystemExit(f"Invalid/duplicate four-session Noise SG: {row}")
              found.add((n,b))
          if found!=expected:
              raise SystemExit(f"Missing Noise SG profiles: {expected-found}")
          seen_sessions=set()
          for row in sessions:
              n,b=int(row["final_owners"]),int(row["payload_bytes"])
              i=int(row["session_id"])
              if ((n,b) not in expected or i not in (1,2,3,4)
                  or (n,b,i) in seen_sessions or
                  int(row["total_shards"])!=n+1):
                  raise SystemExit(f"Invalid Noise SG session: {row}")
              seen_sessions.add((n,b,i))
          if len(seen_sessions)!=24:
              raise SystemExit("Incomplete Noise per-session proof")
          seen_rtt=set()
          for row in rtts:
              key=(int(row["final_owners"]),int(row["payload_bytes"]),
                   int(row["session_id"]),int(row["round"]))
              if key[:3] not in seen_sessions or key[3] not in range(1,33)
                  or key in seen_rtt or row["driver"]!="global-barrier"
                  or int(row["total_shards"])!=key[0]+1
                  or not math.isfinite(float(row["rtt_us"]))
                  or float(row["rtt_us"])<=0:
                  raise SystemExit(f"Invalid Noise chronological RTT: {row}")
              seen_rtt.add(key)
          if len(seen_rtt)!=6*4*32:
              raise SystemExit("Incomplete Noise raw RTT proof")
          print("Six real four-session Noise-only SG profiles PASS:",sorted(found))
          PY
          echo 'Noise-only is genuine P2P Cookie/Noise custom echo; no MMP, Pool or execution RPC. This smoke is not yet matched five-repeat statistics.'
      - name: Archive standalone Noise-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: noise-only-p2p-sg-equal-load
          path: |
            noise-sg-aggregate.csv
            noise-sg-sessions.csv
            noise-sg-rtt.csv
            noise-sg-machine.txt
            noise-sg-*.log
          if-no-files-found: error
      - name: Report ccache
        if: always()
        shell: bash
        run: ccache --show-stats
