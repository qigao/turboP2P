name: Paired raw CNet and signed MMP SG equal-load benchmarks
on:
  pull_request:
    branches: [feature/mesh-mmp-sg-equal-load-benchmark-23]
    paths:
      - 'mesh/bench/**'
      - 'tests/salts_foundation/CMakeLists.txt'
      - '.github/workflows/raw-cnet-sg-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  paired-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-salts-sdk
      - uses: ./.github/actions/setup-compiler-cache
        with:
          profile: linux-raw-signed-sg-paired
      - name: Build raw CNet and signed MMP SG profiles
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/salts_foundation -B build/sg-paired -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DP2P_RAW_CNET_SG_BUILD_BENCHMARKS=ON \
            -DP2P_MMP_SG_BUILD_BENCHMARKS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build build/sg-paired --parallel 2 --target \
            bench_raw_cnet_sg_1 bench_raw_cnet_sg_2 bench_raw_cnet_sg_4 \
            bench_raw_cnet_sg_1_async bench_raw_cnet_sg_2_async bench_raw_cnet_sg_4_async \
            bench_mesh_mmp_sg_1 bench_mesh_mmp_sg_2 bench_mesh_mmp_sg_4 \
            bench_mesh_mmp_sg_1_async bench_mesh_mmp_sg_2_async bench_mesh_mmp_sg_4_async
      - name: Interleave raw and signed four-session samples
        shell: bash
        env:
          P2P_MMP_BENCH_WARMUP: '32'
          P2P_MMP_BENCH_ROUNDS: '256'
        run: |
          set -euo pipefail
          echo 'repeat,protocol,driver,final_owners,total_shards,sessions,payload_bytes,rounds,warmup,wall_ms,process_cpu_ms,process_cpu_pct,app_msgs_per_s,payload_mib_per_s,rtt_p50_us,rtt_p95_us,rtt_p99_us' > paired-sg-aggregate.csv
          echo 'repeat,protocol,driver,final_owners,total_shards,session_id,payload_bytes,rounds,rtt_p50_us,rtt_p95_us,rtt_p99_us' > paired-sg-sessions.csv
          echo 'repeat,protocol,driver,final_owners,total_shards,session_id,payload_bytes,round,rtt_us' > paired-sg-rtt.csv
          {
            uname -a
            lscpu
            cmake --version | head -1
            git rev-parse HEAD
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            echo "SALTS_ROOT=$SALTS_ROOT"
            echo "SALTS_UTILS_ROOT=$SALTS_UTILS_ROOT"
          } > paired-sg-machine.txt
          for repeat in 1 2 3 4 5; do
            for bytes in 8 1024; do
              for finals in 1 2 4; do
                export P2P_MMP_BENCH_PAYLOAD="$bytes"
                for mode in barrier async; do
                  if [ $((repeat % 2)) -eq 0 ]; then order='signed raw'; else order='raw signed'; fi
                  for stack in $order; do
                    if [ "$stack" = raw ]; then
                      exe="bench_raw_cnet_sg_$finals"
                      prefix='RAW_CNET_SG'
                      label='raw-cnet-tcp-echo'
                    else
                      exe="bench_mesh_mmp_sg_$finals"
                      prefix='P2P_MMP_SG'
                      label='sg-signed-ready-data-echo'
                    fi
                    if [ "$mode" = async ]; then exe="$exe"_async; fi
                    log="paired-sg-$stack-$mode-$finals-$bytes-repeat-$repeat.log"
                    "./build/sg-paired/$exe" | tee "$log"
                    grep "^$prefix"_BENCH, "$log" |
                      sed "s/^$prefix\_BENCH,/$repeat,/" >> paired-sg-aggregate.csv
                    grep "^$prefix"_SESSION, "$log" |
                      sed "s/^$prefix\_SESSION,/$repeat,/" >> paired-sg-sessions.csv
                    grep "^$prefix"_RTT, "$log" |
                      sed "s/^$prefix\_RTT,/$repeat,$label,/" >> paired-sg-rtt.csv
                  done
                done
              done
            done
          done
          python3 - <<'PY'
          import csv, math, statistics
          from collections import defaultdict
          def load(path):
              with open(path, newline="", encoding="utf8") as f:
                  return list(csv.DictReader(f))
          aggregate=load("paired-sg-aggregate.csv")
          sessions=load("paired-sg-sessions.csv")
          rtts=load("paired-sg-rtt.csv")
          protocols=("raw-cnet-tcp-echo","sg-signed-ready-data-echo")
          modes=("global-barrier","owner-independent")
          cases={(p,m,n,b,r) for p in protocols for m in modes for n in (1,2,4)
                 for b in (8,1024) for r in range(1,6)}
          lookup={}
          for row in aggregate:
              key=(row["protocol"],row["driver"],int(row["final_owners"]),
                   int(row["payload_bytes"]),int(row["repeat"]))
              metrics=("app_msgs_per_s","wall_ms","process_cpu_ms",
                       "process_cpu_pct","rtt_p95_us")
              if (key not in cases or key in lookup
                  or int(row["total_shards"])!=key[2]+1
                  or int(row["sessions"])!=4 or int(row["rounds"])!=256
                  or int(row["warmup"])!=32
                  or any(not math.isfinite(float(row[k])) or float(row[k])<=0
                         for k in metrics)):
                  raise SystemExit(f"Invalid paired aggregate: {row}")
              lookup[key]=row
          if set(lookup)!=cases:
              raise SystemExit(f"Missing paired profiles: {cases-set(lookup)}")
          expected_sessions={(p,m,n,b,r,c) for (p,m,n,b,r) in cases
                             for c in (1,2,3,4)}
          seen=set()
          for row in sessions:
              key=(row["protocol"],row["driver"],int(row["final_owners"]),
                   int(row["payload_bytes"]),int(row["repeat"]),
                   int(row["session_id"]))
              if (key not in expected_sessions or key in seen
                  or int(row["total_shards"])!=key[2]+1):
                  raise SystemExit(f"Invalid paired session: {row}")
              seen.add(key)
          if seen!=expected_sessions:
              raise SystemExit("Missing per-client paired percentile")
          rtt_seen=set()
          for row in rtts:
              key=(row["protocol"],row["driver"],int(row["final_owners"]),
                   int(row["payload_bytes"]),int(row["repeat"]),
                   int(row["session_id"]),int(row["round"]))
              if (key[:6] not in expected_sessions or key[6] not in range(1,257)
                  or int(row["total_shards"])!=key[2]+1 or key in rtt_seen
                  or not math.isfinite(float(row["rtt_us"]))
                  or float(row["rtt_us"])<=0):
                  raise SystemExit(f"Invalid paired RTT: {row}")
              rtt_seen.add(key)
          if len(rtt_seen)!=len(expected_sessions)*256:
              raise SystemExit("Incomplete paired raw chronological RTT")
          groups=defaultdict(list)
          for key,row in lookup.items():
              groups[key[:4]].append(row)
          with open("paired-sg-summary.csv","w",newline="",encoding="utf8") as out:
              writer=csv.writer(out)
              writer.writerow(["protocol","driver","final_owners","total_shards",
                               "sessions","payload_bytes","repeats","rounds",
                               "median_msgs_per_s","median_process_cpu_pct",
                               "median_rtt_p95_us","min_msgs_per_s","max_msgs_per_s",
                               "median_cpu_us_per_app_msg"])
              for (protocol,mode,n,b),rows in sorted(groups.items()):
                  med=lambda field: statistics.median(float(r[field]) for r in rows)
                  writer.writerow([protocol,mode,n,n+1,4,b,5,256,
                      round(med("app_msgs_per_s"),3),
                      round(med("process_cpu_pct"),3),
                      round(med("rtt_p95_us"),3),
                      round(min(float(r["app_msgs_per_s"]) for r in rows),3),
                      round(max(float(r["app_msgs_per_s"]) for r in rows),3),
                      round(statistics.median(float(r["process_cpu_ms"])*1000/(256*4*2)
                            for r in rows),3)])
          with open("paired-sg-comparison.csv","w",newline="",encoding="utf8") as out:
              writer=csv.writer(out)
              writer.writerow(["driver","final_owners","payload_bytes","repeats",
                               "median_signed_over_raw_msgs_per_s_ratio",
                               "median_signed_over_raw_cpu_pct_ratio",
                               "median_signed_over_raw_p95_rtt_ratio"])
              for mode in modes:
                  for n in (1,2,4):
                      for b in (8,1024):
                          paired=[]
                          for repeat in range(1,6):
                              raw=lookup[("raw-cnet-tcp-echo",mode,n,b,repeat)]
                              signed=lookup[("sg-signed-ready-data-echo",mode,n,b,repeat)]
                              paired.append((
                                  float(signed["app_msgs_per_s"])/float(raw["app_msgs_per_s"]),
                                  float(signed["process_cpu_pct"])/float(raw["process_cpu_pct"]),
                                  float(signed["rtt_p95_us"])/float(raw["rtt_p95_us"])))
                          writer.writerow([mode,n,b,5,
                              *[round(statistics.median(item[i] for item in paired),4)
                                for i in range(3)]])
          PY
          cat paired-sg-summary.csv
          cat paired-sg-comparison.csv
          echo 'Signed ratio includes Noise, MMP READY, P2P framing and Pool Lease enqueue. It is NOT isolated crypto or management RPC overhead.'
      - name: Upload paired raw CNet and signed MMP evidence
        uses: actions/upload-artifact@v4
        with:
          name: paired-raw-cnet-signed-mmp-sg
          path: |
            paired-sg-aggregate.csv
            paired-sg-sessions.csv
            paired-sg-rtt.csv
            paired-sg-summary.csv
            paired-sg-comparison.csv
            paired-sg-machine.txt
            paired-sg-*.log
          if-no-files-found: error
      - name: Report ccache
        if: always()
        shell: bash
        run: ccache --show-stats
