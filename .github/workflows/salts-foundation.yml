name: Salts foundation regression
on:
  pull_request:
    branches: [master, codex/salts-foundation-phase-1, codex/mesh-stream-async-control, codex/mesh-bind-crypto, codex/mesh-stream-cnet-identity, codex/mesh-stream-cnet-channel, codex/mesh-stream-cnet-registry, codex/tunnel-cnet, codex/mgmt-cnet, codex/p2p-security, codex/p2p-cnet-admission, codex/p2p-owner-key-worker, codex/p2p-cnet-peer, codex/p2p-cnet-node, codex/p2p-cnet-files, codex/p2p-cnet-security, codex/p2p-cnet-dht, codex/p2p-public-poll]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: salts-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-salts-sdk
      - name: Configure against installed SDKs
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/salts_foundation -B build/salts-foundation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_MANIFEST_MODE=OFF
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/salts-foundation --parallel 2
          ctest --test-dir build/salts-foundation --output-on-failure
      - name: P2P sanitizer regression
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cmake -S tests/salts_foundation -B build/p2p-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_MANIFEST_MODE=OFF \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie' \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined -no-pie'
          cmake --build build/p2p-sanitize --parallel 2 --target \
            test_p2p_security test_p2p_cnet_transport test_p2p_cnet_admission \
            test_p2p_key_worker test_p2p_cnet_peer test_p2p_cnet_node \
            test_p2p_cnet_files test_p2p_cnet_security_config test_p2p_cnet_dht test_p2p_cnet_lifecycle
          ctest --test-dir build/p2p-sanitize --output-on-failure \
            -R '^test_p2p_(security|cnet_transport|cnet_admission|key_worker|cnet_peer|cnet_node|cnet_files|cnet_security_config|cnet_dht|cnet_lifecycle)$'
