name: P2P SG Host performance profiles
on:
  workflow_dispatch:
  push:
    branches: [feature/p2p-sg-benchmark-23]
    paths:
      - 'p2p/bench/**'
      - 'tests/salts_foundation/CMakeLists.txt'
      - '.github/workflows/p2p-sg-benchmark.yml'
permissions:
  contents: read
  packages: read
concurrency:
  group: p2p-sg-bench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sg-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-salts-sdk
      - uses: ./.github/actions/setup-compiler-cache
        with:
          profile: linux-sg-benchmark
      - name: Configure and build opt-in installed-SDK benchmarks
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/salts_foundation -B build/p2p-sg-benchmark -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DP2P_SG_BUILD_BENCHMARKS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build build/p2p-sg-benchmark --parallel 2 --target \
            bench_p2p_sg_1 bench_p2p_sg_2 bench_p2p_sg_4
      - name: Measure real NativeIO SG + P2P Noise traffic
        shell: bash
        env:
          P2P_SG_BENCH_WARMUP: '16'
          P2P_SG_BENCH_ROUNDS: '128'
        run: |
          set -euo pipefail
          echo 'shards,sessions,rounds,warmup,payload_bytes,wall_ms,process_cpu_ms,process_cpu_pct,app_msgs_per_s,payload_mib_per_s,echo_batch_p50_us,echo_batch_p95_us,echo_batch_p99_us' > p2p-sg-benchmark.csv
          {
            uname -a
            lscpu
            cmake --version | head -1
            date -u +'%Y-%m-%dT%H:%M:%SZ'
          } > p2p-sg-machine.txt
          for shards in 1 2 4; do
            ./build/p2p-sg-benchmark/bench_p2p_sg_"$shards" |
              tee "p2p-sg-bench-$shards.log"
            grep '^P2P_SG_BENCH,' "p2p-sg-bench-$shards.log" |
              sed 's/^P2P_SG_BENCH,//' >> p2p-sg-benchmark.csv
          done
          cat p2p-sg-benchmark.csv
          echo "Not comparable equal-load scaling: 1/2/4 SG workers contain 1/1/3 sessions; no raw-CNet baseline."
      - name: Upload raw performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: p2p-sg-bench-${{ github.sha }}
          path: |
            p2p-sg-benchmark.csv
            p2p-sg-machine.txt
            p2p-sg-bench-*.log
          if-no-files-found: error
      - name: Report ccache
        if: always()
        shell: bash
        run: ccache --show-stats
